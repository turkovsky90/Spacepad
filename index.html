<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spacepad</title>
    <meta name="theme-color" content="#1e1e1e">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlNwYWNlcGFkIiwKICAic2hvcnRfbmFtZSI6ICJTcGFjZXBhZCIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMWUxZTFlIiwKICAidGhlbWVfY29sb3IiOiAiIzFlMWUxZSIsCiAgImljb25zIjogW3sgInNyYyI6ICJpY29uLnBuZyIsICJ0eXBlIjogImltYWdlL3BuZyIsICJzaXplcyI6ICI1MTJ4NTEyIn1dCn0=">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root { --bg: #1e1e1e; --panel: #2d2d2d; --text: #d4d4d4; --accent: #007acc; --border: #444; --btn: #3c3c3c; --btn-hover: #4a4a4a; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; position: fixed; font-family: sans-serif; }
        .container { display: flex; flex-direction: column; height: 100vh; width: 100%; position: absolute; top: 0; left: 0; }

        .tabs-container { display: flex; background: #252526; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .tabs { display: flex; overflow-x: auto; flex: 1; scrollbar-width: none; scroll-behavior: smooth; }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab { display: flex; align-items: stretch; cursor: pointer; border-right: 1px solid var(--border); background: #2d2d2d; font-size: 14px; color: #888; max-width: 180px; transition: background 0.2s; }
        .tab:hover { background: #353535; }
        .tab.active { background: var(--bg); border-top: 3px solid var(--accent); color: #fff; }
        .tab-name { padding: 12px 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; display: flex; align-items: center; }
        .tab-close { padding: 0 12px; display: flex; align-items: center; font-size: 18px; transition: color 0.2s; }
        .tab-close:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .only-one .tab-close { display: none; }

        .add-tab { padding: 12px 22px; cursor: pointer; background: #2d2d2d; color: #fff; font-size: 20px; border-left: 1px solid var(--border); flex-shrink: 0; transition: background 0.2s; }
        .add-tab:hover { background: #353535; }

        .editor-container { flex: 1; position: relative; overflow: hidden; }
        #editor { width: 100%; height: 100%; background: transparent; color: inherit; border: none; outline: none; padding: 15px; font-size: 16px; resize: none; display: block; }
        .font-mono { font-family: 'Consolas', 'Monaco', monospace !important; }
        .font-sans { font-family: sans-serif !important; }

        .footer-controls { flex-shrink: 0; background: var(--panel); border-top: 1px solid var(--border); width: 100%; }
        .scroll-toolbar { display: flex; overflow-x: auto; padding: 10px; align-items: center; scrollbar-width: none; }
        .scroll-toolbar::-webkit-scrollbar { display: none; }
        
        .toolbar-inner { display: flex; gap: 8px; }
        .left-side, .right-side { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .btn-group { display: flex; gap: 4px; padding-right: 10px; flex-shrink: 0; }
        .btn-group:last-child { padding-right: 0; }

        @media (min-width: 768px) {
            .scroll-toolbar { overflow: hidden; }
            .toolbar-inner { width: 100%; justify-content: space-between; }
        }

        button, select { height: 44px; flex: 0 0 auto; background: var(--btn); color: white; border: 1px solid var(--border); padding: 0 14px; cursor: pointer; border-radius: 6px; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        button:hover { background: var(--btn-hover); }
        .active-btn { background: var(--accent) !important; border-color: #0090f0 !important; }

        .status-bar { background: #333; color: #aaa; padding: 6px 12px; font-size: 11px; display: flex; gap: 15px; font-family: sans-serif; overflow-x: auto; white-space: nowrap; }
        .status-bar b { color: #ddd; }
    </style>
</head>
<body>

<div class="container" id="mainApp">
    <div class="tabs-container" id="tabsOuter">
        <div class="tabs" id="tabsBar"></div>
        <div class="add-tab" onclick="newFile()">+</div>
    </div>

    <div class="editor-container">
        <textarea id="editor" class="font-mono" spellcheck="false" oninput="onTextChange()" onkeydown="handleKeyDown(event)" placeholder="Spacepad..."></textarea>
    </div>

    <div class="footer-controls">
        <div class="scroll-toolbar">
            <div class="toolbar-inner">
                <div class="left-side">
                    <div class="btn-group">
                        <button onclick="document.execCommand('undo')">↩️</button>
                        <button onclick="document.execCommand('redo')">↪️</button>
                    </div>
                    <div class="btn-group">
                        <button onclick="document.getElementById('fileInput').click()">📂</button>
                        <input type="file" id="fileInput" hidden onchange="openFile(event)">
                        <select id="saveFormat">
                            <option value="html" selected>.html</option>
                            <option value="txt">.txt</option>
                            <option value="custom">...</option>
                        </select>
                        <button onclick="saveFile()">💾</button>
                    </div>
                    <div class="btn-group">
                        <button onclick="insertChar('    ')">TAB</button>
                    </div>
                </div>

                <div class="right-side">
                    <div class="btn-group">
                        <button onclick="changeZoom(-2)">A-</button>
                        <button onclick="changeZoom(2)">A+</button>
                    </div>
                    <div class="btn-group">
                        <button onclick="toggleWrap()" id="wrapBtn">Wrap</button>
                        <button onclick="toggleFont()" id="fontBtn"><b>M</b></button>
                    </div>
                    <div class="btn-group">
                        <button onclick="clearCurrentFile()">🗑️</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <span>Lines: <b id="statLines">1</b></span>
            <span>Chars: <b id="statChars">0</b></span>
            <span>No spaces: <b id="statNoSpace">0</b></span>
        </div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('data:text/javascript;base64,' + btoa('self.addEventListener("fetch", (e) => {});')); }
    
    let files = JSON.parse(localStorage.getItem('spacepad_files')) || [{ name: 'untitled.html', content: '', fontSize: 16, wrap: true, isMono: true }];
    let activeIndex = parseInt(localStorage.getItem('spacepad_active')) || 0;
    if (activeIndex >= files.length) activeIndex = 0;

    const editor = document.getElementById('editor');
    const mainApp = document.getElementById('mainApp');

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => { mainApp.style.height = window.visualViewport.height + 'px'; window.scrollTo(0, 0); });
    }

    window.addEventListener('keydown', function(e) {
        const ctrlOrCmd = e.ctrlKey || e.metaKey;
        if (ctrlOrCmd) {
            const key = e.key.toLowerCase();
            if (['s', 'o', 'n', 'z', 'y'].includes(key)) {
                e.preventDefault();
                e.stopPropagation();
                if (key === 's') saveFile();
                if (key === 'o') document.getElementById('fileInput').click();
                if (key === 'n') newFile();
                if (key === 'z') document.execCommand('undo');
                if (key === 'y') document.execCommand('redo');
            }
        }
    }, { capture: true });

    function renderTabs() {
        const bar = document.getElementById('tabsBar');
        bar.innerHTML = '';
        document.getElementById('tabsOuter').classList.toggle('only-one', files.length === 1);
        files.forEach((f, i) => {
            const d = document.createElement('div');
            d.className = `tab ${i === activeIndex ? 'active' : ''}`;
            d.innerHTML = `<div class="tab-name" onclick="switchTab(${i})" ondblclick="renameTab(${i})">${f.name}</div><div class="tab-close" onclick="closeTab(${i}, event)">×</div>`;
            bar.appendChild(d);
        });
        const activeTab = document.querySelector('.tab.active');
        if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center' });
        applyData();
    }

    function applyData() {
        const f = files[activeIndex];
        editor.value = f.content;
        editor.style.fontSize = f.fontSize + 'px';
        editor.style.whiteSpace = f.wrap ? 'pre-wrap' : 'pre';
        editor.className = f.isMono ? 'font-mono' : 'font-sans';
        document.getElementById('fontBtn').classList.toggle('active-btn', f.isMono);
        document.getElementById('wrapBtn').classList.toggle('active-btn', f.wrap);
        updateStats();
    }

    function onTextChange() { files[activeIndex].content = editor.value; saveToLocalStorage(); updateStats(); }
    function saveToLocalStorage() { localStorage.setItem('spacepad_files', JSON.stringify(files)); localStorage.setItem('spacepad_active', activeIndex); }

    function handleKeyDown(e) {
        if (e.key === 'Tab') { e.preventDefault(); insertChar('    '); }
        if (e.key === 'Enter') {
            const start = editor.selectionStart;
            const text = editor.value;
            const lines = text.substring(0, start).split('\n');
            const currentLine = lines[lines.length - 1];

            const numMatch = currentLine.match(/^(\s*)(\d+)\.\s+/);
            if (numMatch) {
                e.preventDefault();
                const nextNum = parseInt(numMatch[2]) + 1;
                insertChar('\n' + numMatch[1] + nextNum + '. ');
                return;
            }

            const bulletMatch = currentLine.match(/^(\s*)-\s+/);
            if (bulletMatch) {
                e.preventDefault();
                insertChar('\n' + bulletMatch[0]);
                return;
            }
        }
    }

    function clearCurrentFile() { if (confirm('Clear file?')) { editor.value = ''; onTextChange(); } }
    
    function saveFile() {
        let ext = document.getElementById('saveFormat').value;
        if (ext === 'custom') ext = prompt("Ext:", "html");
        if (!ext) return;
        ext = ext.replace(/^\./, '');
        let baseName = files[activeIndex].name.split('.').slice(0, -1).join('.') || files[activeIndex].name;
        let userInput = prompt("Name:", baseName);
        if (!userInput) return;
        let fullName = userInput.includes('.') ? userInput : userInput + '.' + ext;
        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const blob = new Blob([bom, new TextEncoder().encode(editor.value)], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fullName; a.click();
        files[activeIndex].name = fullName; saveToLocalStorage(); renderTabs();
    }

    function openFile(ev) {
        const f = ev.target.files; if (!f) return;
        const r = new FileReader();
        r.onload = (e) => {
            let t; try { t = new TextDecoder('utf-8', { fatal: true }).decode(e.target.result); } 
            catch { t = new TextDecoder('windows-1251').decode(e.target.result); }
            files.push({ name: f.name, content: t, fontSize: 16, wrap: true, isMono: true });
            activeIndex = files.length - 1; saveToLocalStorage(); renderTabs();
            ev.target.value = '';
        };
        r.readAsArrayBuffer(f);
    }

    function switchTab(i) { files[activeIndex].content = editor.value; activeIndex = i; saveToLocalStorage(); renderTabs(); }
    function newFile() { files.push({ name: 'new_' + (files.length + 1) + '.html', content: '', fontSize: 16, wrap: true, isMono: true }); activeIndex = files.length - 1; saveToLocalStorage(); renderTabs(); }
    function closeTab(i, e) { e.stopPropagation(); files.splice(i, 1); activeIndex = Math.min(activeIndex, files.length - 1); saveToLocalStorage(); renderTabs(); }
    function renameTab(i) { let n = prompt("Rename:", files[i].name); if (n) { files[i].name = n; saveToLocalStorage(); renderTabs(); } }
    function insertChar(c) { editor.focus(); document.execCommand('insertText', false, c); onTextChange(); }
    function toggleFont() { files[activeIndex].isMono = !files[activeIndex].isMono; saveToLocalStorage(); applyData(); }
    function changeZoom(v) { files[activeIndex].fontSize = Math.max(8, files[activeIndex].fontSize + v); applyData(); saveToLocalStorage(); }
    function toggleWrap() { files[activeIndex].wrap = !files[activeIndex].wrap; saveToLocalStorage(); applyData(); }
    function updateStats() { const txt = editor.value; document.getElementById('statLines').innerText = txt ? txt.split('\n').length : 0; document.getElementById('statChars').innerText = txt.length; document.getElementById('statNoSpace').innerText = txt.replace(/\s/g, '').length; }

    renderTabs();
</script>
</body>
</html>
