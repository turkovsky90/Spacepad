<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spacepad</title>
    <meta name="theme-color" content="#1e1e1e">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlNwYWNlcGFkIiwKICAic2hvcnRfbmFtZSI6ICJTcGFjZXBhZCIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMWUxZTFlIiwKICAidGhlbWVfY29sb3IiOiAiIzFlMWUxZSIsCiAgImljb25zIjogW3sgInNyYyI6ICpja29uLnBuZyIsICJ0eXBlIjogImltYWdlL3BuZyIsICJzaXplcyI6ICI1MTJ4NTEyIn1dCn0=">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root { --bg: #1e1e1e; --panel: #2d2d2d; --text: #d4d4d4; --accent: #007acc; --accent-hover: #0090f0; --border: #444; --btn: #3c3c3c; --btn-hover: #4a4a4a; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; position: fixed; font-family: sans-serif; }
        .container { display: flex; flex-direction: column; height: 100vh; width: 100%; position: absolute; top: 0; left: 0; }
        
        .tabs-container { display: flex; background: #252526; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .tabs { display: flex; overflow-x: auto; flex: 1; scrollbar-width: none; scroll-behavior: smooth; }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab { display: flex; align-items: stretch; cursor: pointer; border-right: 1px solid var(--border); background: #2d2d2d; font-size: 14px; color: #888; max-width: 180px; transition: background 0.2s; }
        .tab:hover { background: #353535; }
        .tab.active { background: var(--bg); border-top: 3px solid var(--accent); color: #fff; }
        .tab-name { padding: 12px 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; display: flex; align-items: center; }
        .tab-close { padding: 0 12px; display: flex; align-items: center; font-size: 18px; transition: color 0.2s; }
        .tab-close:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .only-one .tab-close { display: none; }

        .add-tab { padding: 12px 22px; cursor: pointer; background: #2d2d2d; color: #fff; font-size: 20px; border-left: 1px solid var(--border); flex-shrink: 0; transition: background 0.2s; }
        .add-tab:hover { background: #353535; }

        .editor-container { flex: 1; position: relative; overflow: hidden; }
        #editor { width: 100%; height: 100%; background: transparent; color: inherit; border: none; outline: none; padding: 15px; font-size: 16px; resize: none; display: block; }
        .font-mono { font-family: 'Consolas', 'Monaco', monospace !important; }
        .font-sans { font-family: sans-serif !important; }

        .footer-controls { flex-shrink: 0; background: var(--panel); border-top: 1px solid var(--border); width: 100%; }
        .scroll-toolbar { display: flex; overflow-x: auto; gap: 8px; padding: 10px; align-items: center; scrollbar-width: none; }
        .scroll-toolbar::-webkit-scrollbar { display: none; }
        
        .btn-group { display: flex; gap: 4px; padding-right: 10px; flex-shrink: 0; }
        .btn-group:last-child { padding-right: 0; }

        button, select { height: 44px; flex: 0 0 auto; background: var(--btn); color: white; border: 1px solid var(--border); padding: 0 14px; cursor: pointer; border-radius: 6px; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: background 0.2s, border-color 0.2s; }
        button:hover, select:hover { background: var(--btn-hover); }
        .active-btn { background: var(--accent) !important; border-color: #0090f0 !important; }
        .active-btn:hover { background: var(--accent-hover) !important; }

        .status-bar { background: #333; color: #aaa; padding: 6px 12px; font-size: 11px; display: flex; gap: 15px; font-family: sans-serif; overflow-x: auto; white-space: nowrap; }
        .status-bar b { color: #ddd; }

        @media (min-width: 768px) {
            .scroll-toolbar { display: flex; justify-content: space-between; overflow: hidden; }
            .right-aligned { display: flex; margin-left: auto; }
            .desktop-hide { display: none !important; }
        }
    </style>
</head>
<body>
<div class="container" id="mainApp">
    <div class="tabs-container" id="tabsOuter">
        <div class="tabs" id="tabsBar"></div>
        <div class="add-tab" onclick="newFile()">+</div>
    </div>
    <div class="editor-container">
        <textarea id="editor" class="font-mono" spellcheck="false" oninput="onTextChange()" onkeydown="handleKeyDown(event)" placeholder="Spacepad..."></textarea>
    </div>
    <div class="footer-controls">
        <div class="scroll-toolbar">
            <div class="btn-group">
                <button onclick="document.execCommand('undo')">↩️</button>
                <button onclick="document.execCommand('redo')">↪️</button>
            </div>
            <div class="btn-group">
                <button onclick="document.getElementById('fileInput').click()">📂</button>
                <input type="file" id="fileInput" hidden onchange="openFile(event)">
                <select id="saveFormat">
                    <option value="html" selected>.html</option>
                    <option value="txt">.txt</option>
                    <option value="custom">...</option>
                </select>
                <button onclick="saveFile()">💾</button>
            </div>
            <div class="btn-group desktop-hide">
                <button onclick="smartTab()">TAB</button>
            </div>
            <div class="right-aligned btn-group">
                <div class="btn-group">
                    <button onclick="changeZoom(-2)">A-</button>
                    <button onclick="changeZoom(2)">A+</button>
                </div>
                <div class="btn-group">
                    <button onclick="toggleWrap()" id="wrapBtn">Wrap</button>
                    <button onclick="toggleFont()" id="fontBtn"><b>M</b></button>
                </div>
                <div class="btn-group">
                    <button onclick="clearCurrentFile()">🗑️</button>
                </div>
            </div>
        </div>
        <div class="status-bar">
            <span>Lines: <b id="statLines">1</b></span>
            <span>Chars: <b id="statChars">0</b></span>
            <span>No spaces: <b id="statNoSpace">0</b></span>
        </div>
    </div>
</div>
<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('data:text/javascript;base64,' + btoa('self.addEventListener("fetch", (e) => {});')); }
    let files = JSON.parse(localStorage.getItem('spacepad_files')) || [{ name: 'untitled.html', content: '', fontSize: 16, wrap: true, isMono: true }];
    let activeIndex = parseInt(localStorage.getItem('spacepad_active')) || 0;
    if (activeIndex >= files.length) activeIndex = 0;
    const editor = document.getElementById('editor');
    const mainApp = document.getElementById('mainApp');
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', () => { mainApp.style.height = window.visualViewport.height + 'px'; window.scrollTo(0, 0); }); }

    function renderTabs() {
        const bar = document.getElementById('tabsBar'); bar.innerHTML = '';
        document.getElementById('tabsOuter').classList.toggle('only-one', files.length === 1);
        files.forEach((f, i) => {
            const d = document.createElement('div'); d.className = `tab ${i === activeIndex ? 'active' : ''}`;
            d.innerHTML = `<div class="tab-name" onclick="switchTab(${i})" ondblclick="renameTab(${i})">${f.name}</div><div class="tab-close" onclick="closeTab(${i}, event)">×</div>`;
            bar.appendChild(d);
        });
        const activeTab = document.querySelector('.tab.active'); if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center' });
        applyData();
    }

    function applyData() {
        const f = files[activeIndex];
        editor.value = f.content || '';
        editor.style.fontSize = f.fontSize + 'px';
        editor.style.whiteSpace = f.wrap ? 'pre-wrap' : 'pre';
        editor.className = f.isMono ? 'font-mono' : 'font-sans';
        document.getElementById('wrapBtn').classList.toggle('active-btn', f.wrap);
        document.getElementById('fontBtn').classList.toggle('active-btn', f.isMono);
        updateStats();
        saveToLocal();
    }

    function onTextChange() {
        files[activeIndex].content = editor.value;
        updateStats();
        saveToLocal();
    }

    function updateStats() {
        const text = editor.value;
        document.getElementById('statLines').innerText = text.split('\n').length;
        document.getElementById('statChars').innerText = text.length;
        document.getElementById('statNoSpace').innerText = text.replace(/\s/g, '').length;
    }

    function saveToLocal() {
        localStorage.setItem('spacepad_files', JSON.stringify(files));
        localStorage.setItem('spacepad_active', activeIndex);
    }

    function switchTab(i) { activeIndex = i; renderTabs(); }

    function newFile() {
        files.push({ name: 'untitled.html', content: '', fontSize: 16, wrap: true, isMono: true });
        activeIndex = files.length - 1;
        renderTabs();
    }

    function renameTab(i) {
        const newName = prompt('Имя файла:', files[i].name);
        if (newName) { files[i].name = newName; renderTabs(); }
    }

    function closeTab(i, e) {
        e.stopPropagation();
        if (files.length === 1) return;
        files.splice(i, 1);
        if (activeIndex >= files.length) activeIndex = files.length - 1;
        renderTabs();
    }

    function saveFile() {
        const f = files[activeIndex];
        const format = document.getElementById('saveFormat').value;
        let name = f.name;
        if (format !== 'custom') name = name.split('.')[0] + '.' + format;
        const blob = new Blob([editor.value], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
    }

    function openFile(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            files.push({ name: file.name, content: ev.target.result, fontSize: 16, wrap: true, isMono: true });
            activeIndex = files.length - 1; renderTabs();
        };
        reader.readAsText(file);
    }

    function changeZoom(v) { files[activeIndex].fontSize += v; applyData(); }
    function toggleWrap() { files[activeIndex].wrap = !files[activeIndex].wrap; applyData(); }
    function toggleFont() { files[activeIndex].isMono = !files[activeIndex].isMono; applyData(); }
    function clearCurrentFile() { if(confirm('Очистить?')) { editor.value = ''; onTextChange(); } }

    function smartTab() {
        const start = editor.selectionStart;
        const value = editor.value;
        const lineStart = value.lastIndexOf('\n', start - 1) + 1;
        editor.value = value.substring(0, lineStart) + "\t" + value.substring(lineStart);
        editor.selectionStart = editor.selectionEnd = start + 1;
        onTextChange();
    }

    function handleKeyDown(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            smartTab();
        }
        if (e.key === 'Enter') {
            const start = editor.selectionStart;
            const value = editor.value;
            const lineStart = value.lastIndexOf('\n', start - 1) + 1;
            const currentLine = value.substring(lineStart, start);
            const listMatch = currentLine.match(/^(\s*)([-*+]|\d+\.)\s+/);
            
            if (listMatch) {
                e.preventDefault();
                let nextMarker = listMatch[2];
                if (nextMarker.includes('.')) {
                    nextMarker = (parseInt(nextMarker) + 1) + '.';
                }
                const indent = listMatch[1] + nextMarker + ' ';
                editor.value = value.substring(0, start) + '\n' + indent + value.substring(start);
                editor.selectionStart = editor.selectionEnd = start + 1 + indent.length;
                onTextChange();
            }
        }
    }

    renderTabs();
</script>
</body>
</html>
