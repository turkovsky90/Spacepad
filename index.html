<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spacepad</title>
    <!-- PWA meta -->
    <meta name="theme-color" content="#1e1e1e">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlNwYWNlcGFkIiwKICAic2hvcnRfbmFtZSI6ICJTcGFjZXBhZCIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMWUxZTFlIiwKICAidGhlbWVfY29sb3IiOiAiIzFlMWUxZSIsCiAgImljb25zIjogW3sgInNyYyI6ICJodHRwczovL2Nkbi1pY29ucy1wbmcuZmxhdGljb24uY29tLzUxMi8yOTkxLzI5OTE5OTAucG5nIiwgInR5cGUiOiAiaW1hZ2UvcG5nIiwgInNpemVzIjogIjUxMng1MTIiIH1dCn0=">
    
    <style>
        :root { --bg: #1e1e1e; --panel: #2d2d2d; --text: #d4d4d4; --accent: #007acc; --border: #444; --btn: #3c3c3c; --modified: #ff9800; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; position: fixed; font-family: sans-serif; }
        .container { display: flex; flex-direction: column; height: 100vh; width: 100%; position: absolute; top: 0; left: 0; }

        .tabs-container { display: flex; background: #252526; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .tabs { display: flex; overflow-x: auto; flex: 1; scrollbar-width: none; scroll-behavior: smooth; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 12px 18px; cursor: pointer; border-right: 1px solid var(--border); display: flex; align-items: center; gap: 8px; white-space: nowrap; background: #2d2d2d; font-size: 14px; color: #888; position: relative; max-width: 180px; }
        .tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .tab.active { background: var(--bg); border-top: 3px solid var(--accent); color: #fff; }
        
        .dot { width: 6px; height: 6px; background: var(--modified); border-radius: 50%; display: inline-block; opacity: 0; transition: 0.3s; flex-shrink: 0; }
        .modified .dot { opacity: 1; }
        .add-tab { padding: 12px 22px; cursor: pointer; background: #2d2d2d; color: #888; font-size: 20px; border-left: 1px solid var(--border); flex-shrink: 0; }

        .editor-container { flex: 1; position: relative; overflow: hidden; }
        #editor { width: 100%; height: 100%; background: transparent; color: inherit; border: none; outline: none; padding: 15px; font-size: 16px; resize: none; display: block; }
        .font-mono { font-family: 'Consolas', 'Monaco', monospace !important; }
        .font-sans { font-family: sans-serif !important; }

        .footer-controls { flex-shrink: 0; background: var(--panel); border-top: 1px solid var(--border); width: 100%; }
        #codeHelper { display: none; background: #252526; padding: 8px; border-bottom: 1px solid var(--border); overflow-x: auto; gap: 6px; }
        .scroll-toolbar { display: flex; overflow-x: auto; gap: 8px; padding: 10px; align-items: center; scrollbar-width: none; }
        .scroll-toolbar::-webkit-scrollbar { display: none; }
        
        .btn-group { display: flex; gap: 4px; padding-right: 10px; flex-shrink: 0; }
        .btn-group:last-child { padding-right: 0; }

        button, select { height: 44px; flex: 0 0 auto; background: var(--btn); color: white; border: 1px solid var(--border); padding: 0 14px; cursor: pointer; border-radius: 6px; font-size: 14px; display: flex; align-items: center; justify-content: center; position: relative; }
        .active-btn { background: var(--accent) !important; border-color: #0090f0 !important; }
        .save-dot { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; background: var(--modified); border-radius: 50%; display: none; }
        .modified-save .save-dot { display: block; }

        .status-bar { background: #333; color: #aaa; padding: 6px 12px; font-size: 11px; display: flex; gap: 15px; font-family: sans-serif; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    </style>
</head>
<body>

<div class="container" id="mainApp">
    <div class="tabs-container">
        <div class="tabs" id="tabsBar"></div>
        <div class="add-tab" onclick="newFile()">+</div>
    </div>

    <div class="editor-container">
        <textarea id="editor" class="font-mono" spellcheck="false" oninput="onTextChange()" onkeydown="handleKeydown(event)" placeholder="Spacepad..."></textarea>
    </div>

    <div class="footer-controls">
        <div id="codeHelper">
            <button onclick="insertChar('    ')">TAB</button>
            <button onclick="insertChar('{')">{</button><button onclick="insertChar('}')">}</button>
            <button onclick="insertChar('[')">[</button><button onclick="insertChar(']')">]</button>
            <button onclick="insertChar('(')">(</button><button onclick="insertChar(')')">)</button>
            <button onclick="insertChar(';')">;</button>
        </div>

        <div class="scroll-toolbar">
            <div class="btn-group">
                <button onclick="document.execCommand('undo')">↩️</button>
                <button onclick="document.execCommand('redo')">↪️</button>
            </div>

            <div class="btn-group">
                <button onclick="document.getElementById('fileInput').click()">📂</button>
                <input type="file" id="fileInput" hidden onchange="openFile(event)">
                <select id="saveFormat">
                    <option value="html">.html</option>
                    <option value="txt">.txt</option>
                    <option value="custom">...</option>
                </select>
                <button onclick="saveFile()" id="saveBtn">💾 <div class="save-dot"></div></button>
            </div>

            <div class="btn-group">
                <button onclick="toggleCodeHelper()" id="codeBtn">{ }</button>
            </div>

            <div class="btn-group">
                <button onclick="changeZoom(2)">A+</button>
                <button onclick="changeZoom(-2)">A-</button>
            </div>

            <div class="btn-group">
                <button onclick="toggleWrap()" id="wrapBtn">Wrap</button>
                <button onclick="toggleFont()" id="fontBtn"><b>M</b></button>
            </div>

            <div class="btn-group">
                <button onclick="clearCurrentText()">🗑️</button>
            </div>
        </div>

        <div class="status-bar">
            <span>Стр: <b id="statLines">1</b></span>
            <span>Симв: <b id="statChars">0</b></span>
            <span>Без проб: <b id="statNoSpace">0</b></span>
        </div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('data:text/javascript;base64,' + btoa('self.addEventListener("fetch", (e) => {});'));
    }

    let files = [{ name: 'untitled.html', content: '', savedContent: '', fontSize: 16, wrap: true, isMono: true }];
    let activeIndex = 0;
    const editor = document.getElementById('editor');
    const mainApp = document.getElementById('mainApp');

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            mainApp.style.height = window.visualViewport.height + 'px';
            window.scrollTo(0, 0);
        });
    }

    function handleKeydown(e) {
        if (e.key === 'Enter') {
            const start = editor.selectionStart;
            const textBefore = editor.value.substring(0, start);
            const lines = textBefore.split('\n');
            const lastLine = lines[lines.length - 1];

            if (lastLine.startsWith('- ')) {
                if (lastLine.trim() === '-') return;
                e.preventDefault();
                insertChar('\n- ');
                return;
            }

            const numMatch = lastLine.match(/^(\d+)\.\s/);
            if (numMatch) {
                if (lastLine.trim() === numMatch + '.') return;
                e.preventDefault();
                const nextNum = parseInt(numMatch) + 1;
                insertChar('\n' + nextNum + '. ');
                return;
            }
        }
    }

    function renderTabs() {
        const bar = document.getElementById('tabsBar');
        bar.innerHTML = '';
        const showClose = files.length > 1;
        
        files.forEach((f, i) => {
            const isModified = f.content !== f.savedContent;
            const d = document.createElement('div');
            d.id = `tab-${i}`;
            d.className = `tab ${i === activeIndex ? 'active' : ''} ${isModified ? 'modified' : ''}`;
            
            let closeBtn = showClose ? `<span onclick="closeTab(${i}, event)" style="margin-left:8px; font-size:18px">×</span>` : '';
            
            d.innerHTML = `
                <span class="dot"></span>
                <span class="tab-name" onclick="switchTab(${i})" ondblclick="renameTab(${i})">${f.name}</span>
                ${closeBtn}
            `;
            bar.appendChild(d);
        });
        const activeTab = document.getElementById(`tab-${activeIndex}`);
        if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center' });
        applyData();
    }

    function applyData() {
        const f = files[activeIndex];
        editor.value = f.content;
        editor.style.fontSize = f.fontSize + 'px';
        editor.style.whiteSpace = f.wrap ? 'pre-wrap' : 'pre';
        editor.className = f.isMono ? 'font-mono' : 'font-sans';
        document.getElementById('fontBtn').classList.toggle('active-btn', f.isMono);
        document.getElementById('wrapBtn').classList.toggle('active-btn', f.wrap);
        checkModified();
        updateStats();
    }

    function onTextChange() {
        files[activeIndex].content = editor.value;
        checkModified();
        updateStats();
    }

    function checkModified() {
        const isModified = files[activeIndex].content !== files[activeIndex].savedContent;
        const currentTab = document.getElementById(`tab-${activeIndex}`);
        if (currentTab) currentTab.classList.toggle('modified', isModified);
        document.getElementById('saveBtn').classList.toggle('modified-save', isModified);
    }

    function saveFile() {
        let ext = document.getElementById('saveFormat').value;
        if (ext === 'custom') ext = prompt("Расширение:", "html");
        if (!ext) return;
        ext = ext.replace(/^\./, '');
        let currentName = files[activeIndex].name;
        let lastDot = currentName.lastIndexOf('.');
        let baseName = lastDot > 0 ? currentName.substring(0, lastDot) : currentName;
        let userInput = prompt("Имя файла:", baseName);
        if (!userInput) return;
        let fullName = userInput.includes('.') ? userInput : `${userInput}.${ext}`;
        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const content = new TextEncoder().encode(editor.value);
        const blob = new Blob([bom, content], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fullName;
        a.click();
        files[activeIndex].name = fullName;
        files[activeIndex].savedContent = editor.value;
        renderTabs();
    }

    function openFile(ev) {
        const f = ev.target.files;
        if (!f) return;
        const r = new FileReader();
        r.onload = (e) => {
            const buffer = e.target.result;
            let text;
            try {
                const decoder = new TextDecoder('utf-8', { fatal: true });
                text = decoder.decode(buffer);
            } catch {
                const decoderANSI = new TextDecoder('windows-1251');
                text = decoderANSI.decode(buffer);
            }
            files.push({ name: f.name, content: text, savedContent: text, fontSize: 16, wrap: true, isMono: true });
            activeIndex = files.length - 1;
            renderTabs();
            ev.target.value = '';
        };
        r.readAsArrayBuffer(f);
    }

    function switchTab(i) {
        files[activeIndex].content = editor.value;
        activeIndex = i;
        renderTabs();
    }

    function newFile() {
        files.push({ name: 'new_' + (files.length + 1) + '.html', content: '', savedContent: '', fontSize: 16, wrap: true, isMono: true });
        activeIndex = files.length - 1;
        renderTabs();
    }

    function closeTab(i, e) {
        e.stopPropagation();
        if (files[i].content !== files[i].savedContent && !confirm('Не сохранено. Закрыть?')) return;
        if (files.length > 1) {
            files.splice(i, 1);
            activeIndex = Math.min(activeIndex, files.length - 1);
            renderTabs();
        }
    }

    function renameTab(i) {
        let n = prompt("Переименовать:", files[i].name);
        if (n) { files[i].name = n; renderTabs(); }
    }

    function insertChar(c) {
        editor.focus();
        document.execCommand('insertText', false, c);
        onTextChange();
    }

    function toggleCodeHelper() {
        const p = document.getElementById('codeHelper');
        const isH = p.style.display === 'none' || p.style.display === '';
        p.style.display = isH ? 'flex' : 'none';
        document.getElementById('codeBtn').classList.toggle('active-btn', isH);
    }

    function toggleFont() {
        files[activeIndex].isMono = !files[activeIndex].isMono;
        applyData();
    }

    function changeZoom(v) {
        files[activeIndex].fontSize = Math.max(8, files[activeIndex].fontSize + v);
        editor.style.fontSize = files[activeIndex].fontSize + 'px';
    }

    function toggleWrap() {
        files[activeIndex].wrap = !files[activeIndex].wrap;
        applyData();
    }

    function clearCurrentText() {
        if (confirm('Очистить текущую вкладку?')) {
            editor.value = '';
            onTextChange();
        }
    }

    function updateStats() {
        const txt = editor.value;
        document.getElementById('statLines').innerText = txt ? txt.split('\n').length : 0;
        document.getElementById('statChars').innerText = txt.length;
        document.getElementById('statNoSpace').innerText = txt.replace(/\s/g, '').length;
    }

    renderTabs();
</script>
</body>
</html>
